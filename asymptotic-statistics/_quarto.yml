project:
  type: book
  output-dir: _book

bibliography: references.bib
nocite: '@*'

# This book is a selected set of nonconsecutive chapters. Custom float types
# keep figure labels aligned with van der Vaart's chapter numbers rather than
# the files' sequential positions in this Quarto project.
crossref:
  chapters: false
  custom:
    - kind: float
      key: glossaryfig
      reference-prefix: Figure G.
      caption-prefix: Figure G.
      space-before-numbering: false
    - kind: float
      key: twofig
      reference-prefix: Figure 2.
      caption-prefix: Figure 2.
      space-before-numbering: false
    - kind: float
      key: sixfig
      reference-prefix: Figure 6.
      caption-prefix: Figure 6.
      space-before-numbering: false
    - kind: float
      key: sevenfig
      reference-prefix: Figure 7.
      caption-prefix: Figure 7.
      space-before-numbering: false
    - kind: float
      key: eightfig
      reference-prefix: Figure 8.
      caption-prefix: Figure 8.
      space-before-numbering: false
    - kind: float
      key: fifteenfig
      reference-prefix: Figure 15.
      caption-prefix: Figure 15.
      space-before-numbering: false
    - kind: float
      key: eighteenfig
      reference-prefix: Figure 18.
      caption-prefix: Figure 18.
      space-before-numbering: false
    - kind: float
      key: nineteenfig
      reference-prefix: Figure 19.
      caption-prefix: Figure 19.
      space-before-numbering: false
    - kind: float
      key: twentyfivefig
      reference-prefix: Figure 25.
      caption-prefix: Figure 25.
      space-before-numbering: false

book:
  title: "Asymptotic Statistics"
  search: true
  chapters:
    - index.qmd
    - glossary.qmd
    - chapter-2.qmd
    - chapter-3.qmd
    - chapter-5.qmd
    - chapter-6.qmd
    - chapter-7.qmd
    - chapter-8.qmd
    - chapter-11.qmd
    - chapter-15.qmd
    - chapter-18.qmd
    - chapter-19.qmd
    - chapter-20.qmd
    - chapter-25.qmd
    - problems.qmd
    - references.qmd

format:
  html:
    theme: cosmo
    toc: true
    # Preserve the source book's selected chapter numbers (2, 3, 5, 6, 7, 8,
    # 11, 15, 18, 19, 20, and 25) rather than renumbering them sequentially.
    number-sections: false
    link-external-newwindow: true
